  <h2 style="font-size:34px;color:#754C78">What are Indian Knowledge Systems?</h2>
  <p style="font-size:17px;line-height:1.7">Indian Knowledge Systems (IKS) is the umbrella term for India's long-standing bodies of knowledge in science, mathematics, medicine, language, arts, philosophy and practical craft. They were developed over thousands of years and passed on through gurukulas, scholarly lineages and written texts.</p>

  <section id="encoding" style="padding:64px 40px;max-width:1100px;margin:0 auto">
  <h2 style="font-size:34px;color:#B65C42">Knowledge Transmission and Numerical Encoding</h2>
  <p style="font-size:17px;line-height:1.7">Before print, knowledge travelled by recitation: students memorised verse with strict metre and rules of recitation, and texts were later copied onto palm leaf and birch bark. To fit numbers into verse, scholars used word-based schemes. The <b>Katapayadi</b> system assigns digits to consonants, so a memorable word can hide a number. <b>Bhuta Sankhya</b> uses objects, like <i>eye</i> or <i>moon</i> for 2 and 1, as number words.</p>
  <div style="background:#FBF7EF;border-radius:14px;padding:26px;margin-top:20px;box-shadow:0 4px 14px rgba(0,0,0,.1)">
  <h3 style="font-size:22px;color:#754C78">Katapayadi Explorer</h3>
  <p style="font-size:15px;line-height:1.6">Rules (as summarised in Śaṅkaravarman’s Sadratnamālā): n, ñ and vowels standing alone give 0; consonants from ka, ṭa, pa and ya give 1, 2, 3 ... in order; in a conjunct only the last consonant counts; the vowel is ignored. Digits are read right to left ("aṅkānāṁ vāmato gatiḥ"). Try the book’s example: nānājñānapragalbhaḥ gives 4320000.</p>
  <label for="kp" style="font-weight:600;font-size:14px">Type syllables (e.g. ka ma la ya)</label><br>
  <input id="kp" value="{{ktext}}" onChange="{{setK}}" style="margin-top:6px;width:100%;max-width:420px;box-sizing:border-box;padding:12px;font:16px Poppins;border:2px solid #754C78;border-radius:8px">
  <p style="font-size:18px;margin:14px 0 0">Digits: <b>{{kdigits}}</b> &nbsp; Read right to left: <b>{{knum}}</b></p>
  <p style="font-size:13px;margin:10px 0 0;color:#101F35">Mapping: ka kha ga gha ṅa = 1–5; ca cha ja jha ña = 6,7,8,9,0; ṭa ṭha ḍa ḍha ṇa = 1–5; ta tha da dha na = 6,7,8,9,0; pa pha ba bha ma = 1–5; ya ra la va śa ṣa sa ha ḷa = 1–9. The system is dated to the 4th century CE and attributed to the Kerala astronomer Vararuci, who stored the Moon’s position for 248 days in the Candravākyas. It is a numeral code for memory, not encryption: anyone who knows the rule can read it. Source: MoE (2025), Vol. I, Ch. 4.3.</p>
  </div>
  <div style="background:#FBF7EF;border-radius:14px;padding:26px;margin-top:20px;box-shadow:0 4px 14px rgba(0,0,0,.1)">
  <h3 style="font-size:22px;color:#176B63">Bhuta Sankhya Explorer</h3>
  <p style="font-size:15px;line-height:1.6">Number-words from nature and tradition stand for digits: <b>kha</b> (sky) 0, <b>chandra</b>, <b>indu</b>, <b>bhumi</b> (moon, earth) 1, <b>netra</b> (eyes) 2, <b>agni</b> (fire) 3, <b>veda</b> 4, <b>indriya</b> (senses) 5, <b>rudra</b> (names of Śiva) 11, <b>surya</b> (names of the Sun) 12. Words are read in order from right to left. The system is clearly used from Varāhamihira’s Pañcasiddhāntikā (c. 550 CE); earlier texts use number words occasionally. The list is representative, not complete (MoE 2025, Ch. 4.3.1). It is a way to write numbers in verse, not a secret code.</p>
  <label for="bs" style="font-weight:600;font-size:14px">Type words (e.g. netra agni chandra, or rudra kha)</label><br>
  <input id="bs" value="{{btext}}" onChange="{{setB}}" style="margin-top:6px;width:100%;max-width:420px;box-sizing:border-box;padding:12px;font:16px Poppins;border:2px solid #176B63;border-radius:8px">
  <p style="font-size:18px;margin:14px 0 0">Digits: <b>{{bdigits}}</b> &nbsp; Read right to left: <b>{{bnum}}</b></p></div>
  </section>

  <section id="crypto" style="padding:64px 40px;background:#FBF7EF">
  <div style="max-width:1100px;margin:0 auto">
  <h2 style="font-size:34px;color:#101F35">Introduction to Cryptography</h2>
  <p style="font-size:17px;line-height:1.7">Cryptography is the practice of protecting information so that only the intended reader can understand it. <b>Plaintext</b> is the readable message; <b>encryption</b> turns it into <b>ciphertext</b> using a <b>key</b>; <b>decryption</b> reverses it. The Caesar cipher, a simple substitution cipher, shifts each letter by a fixed number of places. Modern systems protect payments, banking, messaging and passwords with far stronger mathematics. Katapayadi and Bhuta Sankhya are different: they are numbering aids, and no source shows them as a secret-communication system.</p>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px;font-weight:600">
  <span style="background:#FBF7EF;padding:12px 18px;border-radius:8px">Plaintext</span>→
  <span style="background:#B65C42;color:#fff;padding:12px 18px;border-radius:8px">Encrypt + key</span>→
  <span style="background:#FBF7EF;padding:12px 18px;border-radius:8px">Ciphertext</span>→
  <span style="background:#176B63;color:#fff;padding:12px 18px;border-radius:8px">Decrypt + key</span>→
  <span style="background:#FBF7EF;padding:12px 18px;border-radius:8px">Plaintext</span></div>
  </div></section>

  <div style="background:#FBF7EF;border-radius:14px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.1)">
  <h3 style="font-size:21px;color:#176B63">Secret Message Challenge</h3>
  <p style="font-size:15px;line-height:1.6">Decode this message. Hint: it was shifted by 3, so shift back by 3.</p>
  <p style="font:600 24px monospace;letter-spacing:.14em;margin:8px 0;color:#754C78">FRQJUDWXODWLRQV</p>

  <p style="line-height:1.7;font-size:15px"><b>Primary texts:</b> Aryabhatiya (Aryabhata, 499 CE); Brahmasphutasiddhanta (Brahmagupta, 628 CE); Ashtadhyayi (Panini); Charaka Samhita and Sushruta Samhita; Natyashastra; Yoga Sutras. <b>Modern studies:</b> Kim Plofker, <i>Mathematics in India</i> (Princeton, 2009); Singh, S., <i>The Code Book</i> (1999) for cryptography; Dutta, A. K., on Katapayadi in Kerala mathematics. Treat dates as approximate where scholars disagree, and verify with these sources before citing.</p>

  <script>

  class Component extends DCLogic {
    constructor(p){super(p);this.state={intro:true,stage:0,px:0,py:0,tl:{},btext:'netra agni chandra',skey:'QWERTYUIOPASDFGHJKLZXCVBNM',smsg:'HELLO',open:{},ktext:'ka ma la ya',ctext:'HELLO SANSKRIT',shift:3,mode:'enc',ans:'',verdict:'Not answered yet',points:0,done:false};}

    renderVals(){
      const s=this.state;const X=this.more();
      const cols=['#101F35','#176B63','#754C78','#B65C42','#101F35','#101F35','#176B63','#754C78','#B65C42'];
      const B=[
      ['गणित','Ganita','Indian Mathematics','Place-value numerals, zero, geometry and infinite series.','Indian mathematics grew from the ritual geometry of the Śulbasūtras to the analytical work of the Kerala school. It treats numbers as tools for astronomy, ritual and daily accounting, and developed several ways of writing numbers in verse.',['The decimal place-value system and zero as a number','Śulbasūtra geometry: constructions, approximations for √2 and π, the Baudhāyana-Pythagoras theorem','Number encodings: Bhūtasaṅkhyā, Āryabhaṭa’s alphanumeric system, Kaṭapayādi'],'Baudhāyana (Śulbasūtra), Āryabhaṭa, Brahmagupta; Mādhava (c. 1340–1420), Parameśvara and the Kerala school; Tantrasaṅgraha, Yuktibhāṣā','Kerala-school infinite series for sine, cosine, arctangent and π are studied in the history of analysis.','Ch. 4'],
      ['ज्योतिष','Jyotisha','Astronomy and Calendar','Timekeeping, almanacs, planetary computation and observatories.','Jyotiṣa is the study of the sky for calendars, rituals and prediction of planetary positions. Bhāskara II describes it as the eyes of the Veda. Chapter 2 of the volume covers calendars and chronometry, and Chapter 3 covers instruments (yantras).',['The Pañcāṅga, the Indian almanac, built from tithi, nakṣatra and related elements','Planetary computation from Siddhāntic, Karaṇa and Vākya texts','Observational instruments, including the Jantar Mantar observatories'],'Vedāṅgajyotiṣa (Lagadha), Āryabhaṭa, Bhāskara II','The National Calendar of India and festival dates such as Kumbh Melā are calendrical computations.','Ch. 2 and 3'],
      ['आयुर्वेद','Ayurveda','Traditional Medicine','A systems approach to health, diet, medicine and disease management.','Āyurveda treats health as a dynamic balance of body, mind and consciousness. Its core framework is tridoṣa: Vāta, Pitta and Kapha. It is documented in classical saṃhitās and has eight clinical specialities.',['Tridoṣa (V, P, K) as a common language for diet, season and symptoms','Dravyaguṇa Rasapañcaka: rasa, guṇa, vīrya, vipāka and prabhāva of a substance','Over 6,500 plants are used across India’s medical systems; the book profiles ten such as Āmalakī, Tulasī and Haridrā'],'Caraka and Suśruta (saṃhitās) and other ācāryas','Personalised diet, daily and seasonal regimens and multimodal treatment are discussed in the volume.','Ch. 6 and 7'],
      ['व्याकरण','Vyakarana','Grammar and Linguistics','Rule-based analysis of Sanskrit and its sister Vedāṅgas.','Vyākaraṇa is one of the six Vedāṅgas, alongside Śikṣā (phonetics), Chandas (prosody), Nirukta (etymology), Kalpa (ritual) and Jyotiṣa. Bhāskara II calls grammar the face of the Veda. Pingala’s Chandaḥ-sūtra on metres also discusses counting and combinations.',['Śikṣā: correct sound production for recitation','Chandas: metres counted by syllables, used later as number words','Vyākaraṇa: compact rules that generate correct forms'],'Pāṇini (Aṣṭādhyāyī), Patañjali (Mahābhāṣya), Piṅgala (Chandaḥ-sūtra)','Scholars compare Pāṇini’s rule-based style with formal systems used in computing; treat this as a comparison, not a direct lineage.','Ch. 1 (Vedāṅgas, 1.10); Vol. I does not treat grammar in detail'],
      ['वास्तु','Vastu Shastra','Architecture','Texts on planning, proportion and construction.','Vol. I lists architecture and town planning among subjects studied in ancient India but does not treat them in depth. The Śulbasūtra geometry of Chapter 4 shows how ritual altar construction drove geometrical knowledge, a related technical tradition.',['Śulbasūtra constructions for altars (see Ganita)','Planning, orientation and proportion in traditional building texts','Regional temple and town-planning traditions'],'Mayamata and Mānasāra are commonly cited Vāstu texts (not covered in Vol. I)','Traditional proportion and layout ideas are studied in architectural history.','Ch. 1 (1.3) and Ch. 4 (4.4); add a dedicated architecture source'],
      ['योग','Yoga and Darshana','Philosophy','Schools of reasoned inquiry and practices of discipline.','Darśanas, also called Ānvīkṣikī, are India’s philosophical systems. They examine knowledge, reality and liberation through debate and reasoning. Sāṅkhya, for example, counts 25 fundamental principles (tattvas).',['Darśana: the schools of Indian philosophy','Sāṅkhya’s 25 tattvas, a classification of reality','Yoga as a discipline of body, breath and mind'],'Patañjali (Yoga Sūtras); Sāṅkhya, Nyāya and Vedānta texts','Philosophy and yoga remain active fields of study and practice.','Ch. 1 (1.11); Vol. I does not cover yoga practice in detail'],
      ['धातु','Dhatu Vidya','Metallurgy and Chemistry','Metals, apparatus and processes of Rasāyanaśāstra.','Metallurgy was a cornerstone of technology in ancient India. Gold, iron, zinc and copper were worked, and iron and zinc, more reactive metals, were known in the pure state. The Ṛgveda (1.116.15) mentions an iron leg given to Viśpalā.',['Yantra: apparatus; Mūṣā: crucible; Puṭa: calcination pit','Dravya vargas: classification of materials','Links to medicine through metal preparations'],'Rasāyanaśāstra literature; Ṛgveda 1.116.15 for early iron','Foundations of materials science are drawn from these traditions.','Ch. 5'],
      ['कृषि','Krishi','Agriculture and Ecology','Soil, water, weather, pests and animal husbandry.','Kṛṣi Pārāśara, over 2,500 years old, is described in the volume as perhaps the world’s first dedicated farming textbook. Later regional texts show a continuous tradition of testing and recording knowledge.',['Soil and land classification, ploughing, water management','Rainfall prediction, pest and disease management','Ethical animal husbandry and wildlife conservation'],'Kṛṣi Pārāśara; Vṛkṣāyurveda (Surapāla); Lokopakāra (Karnataka); Kṛṣi Gītā (Kerala)','The book compares chemical, organic and traditional farming and discusses modern challenges.','Ch. 8'],
      ['संगीत','Sangeeta','Music and Performing Arts','Theory of music, drama, poetry and literature.','Vol. I lists Saṅgīta, Nāṭya, Kāvya and Sāhitya among the subjects studied in ancient India, with the fine arts taught alongside practical skills. It does not give a detailed account of music theory.',['Saṅgīta: music; Nāṭya: drama','Kāvya and Sāhitya: poetry and literature','Instrument design and sculpture as taught crafts'],'Bharata’s Nāṭyaśāstra is the classic treatise (not covered in Vol. I)','Classical music and dance continue as living traditions.','Ch. 1 (1.3); add a dedicated music source']];
      const branches=B.map((b,i)=>({dev:b[0],name:b[1],sub:b[2],intro:b[3],ov:b[4],ideas:b[5].map(x=>({x})),who:b[6],ex:b[7],src:'MoE IKS Division (2025), Vol. I, '+b[8],c:cols[i],open:!!s.open[i],label:s.open[i]?'Close':'Learn more',toggle:()=>this.setState({open:{...s.open,[i]:!s.open[i]}})}));
      const eras=[
      {when:'Vedic period',t:'Oral tradition',d:'Hymns and ritual texts preserved by precise recitation across generations.',c:'#B65C42'},
      {when:'Post-Vedic',t:'Sutras and treatises',d:'Compact rule-texts and specialised treatises in grammar, medicine and astronomy.',c:'#101F35'},
      {when:'Classical',t:'Centres of learning',d:'Takshashila and Nalanda drew scholars; Nalanda flourished roughly from the 5th century CE.',c:'#176B63'},
      {when:'Today',t:'Revival',d:'IKS is part of formal curricula in India and a field of research.',c:'#754C78'}];
      const shift=+s.shift;const k=s.mode==='enc'?shift:26-shift;
      const cout=s.ctext.replace(/[a-z]/gi,ch=>{const b=ch<'a'?65:97;return String.fromCharCode((ch.charCodeAt(0)-b+k)%26+b)}).toUpperCase();
      const map={};
      [['k','kh','g','gh','ṅ'],['c','ch','j','jh','ñ'],['ṭ','ṭh','ḍ','ḍh','ṇ'],['t','th','d','dh','n'],['p','ph','b','bh','m']].forEach((g,gi)=>g.forEach((x,i)=>{map[x]=gi===1||gi===3?(i+6)%10:i+1;}));
      ['y','r','l','v','ś','ṣ','s','h','ḷ'].forEach((x,i)=>map[x]=i+1);
      const toks=/kh|gh|ch|jh|ṭh|ḍh|th|dh|ph|bh|[kgcjṭḍtdpbṅñṇnmyrlvśṣshḷ]/g;
      let digits=[];
      s.ktext.toLowerCase().split(/[aāiīuūeoṛṝ\s]+/).forEach(cl=>{const m=cl.match(toks);if(m)digits.push(map[m[m.length-1]]);});
      const kd=digits.join(' ')||'-';const kn=digits.slice().reverse().join('')||'-';
      return {...X,branches,eras,ktext:s.ktext,ctext:s.ctext,shift:s.shift,cout:cout||'...',ans:s.ans,verdict:s.verdict,points:s.points,kdigits:kd,knum:kn,
      encBg:s.mode==='enc'?'#176B63':'#4A5568',decBg:s.mode==='dec'?'#754C78':'#4A5568',
      setK:e=>this.setState({ktext:e.target.value}),setC:e=>this.setState({ctext:e.target.value}),setS:e=>this.setState({shift:e.target.value}),setA:e=>this.setState({ans:e.target.value}),
      doEnc:()=>this.setState({mode:'enc'}),doDec:()=>this.setState({mode:'dec'}),
      check:()=>{const ok=s.ans.trim().toUpperCase()==='CONGRATULATIONS';this.setState({verdict:ok?'Correct!':'Not quite, try again.',points:ok&&!s.done?s.points+10:s.points,done:s.done||ok});}};
    }
    more(){const s=this.state;
      const st=[{t:'Manuscript',big:'ज्ञानम्',cap:'Knowledge preserved on palm leaf and birch bark and kept alive by recitation.'},
      {t:'Numerals',big:'क म ल → 1 5 3 → 351',cap:'Katapayadi turns the syllables ka-ma-la into digits, read right to left. It is a numbering aid, not encryption.'},
      {t:'Binary',big:'351 = 101011111',cap:'Computers store the same number as bits. The representation changes, not the quantity.'},
      {t:'Encryption',big:'Locked',cap:'Only this last step is cryptography: keys protect the bits. The ancient numeral step was never encryption.'}];
      const stg=st.map((x,i)=>({...x,op:s.stage===i?1:0,ty:s.stage===i?0:14,lock:i===3,bg:s.stage===i?'#D5A64A':'transparent',fg:s.stage===i?'#101F35':'#F4EBDD',pick:()=>this.setState({stage:i})}));
      const T=[['c. 1500–500 BCE','Vedic corpus','Hymns and ritual texts, transmitted orally with elaborate recitation methods. Composition dates are debated.'],
      ['c. 4th century BCE','Panini','Ashtadhyayi, a compact rule system for Sanskrit grammar.'],
      ['499 CE','Aryabhata','Aryabhatiya treats mathematics and astronomy in verse.'],
      ['628 CE','Brahmagupta','Brahmasphutasiddhanta includes early written rules for arithmetic with zero.'],
      ['5th–12th century CE','Nalanda','A major Buddhist monastic university that attracted scholars from across Asia.']];
      const tl=T.map((m,i)=>({when:m[0],t:m[1],d:m[2],open:!!s.tl[i],dot:s.tl[i]?'#D5A64A':'#176B63',toggle:()=>this.setState({tl:{...s.tl,[i]:!s.tl[i]}})}));
      const BW={kha:0,shunya:0,chandra:1,indu:1,bhumi:1,netra:2,nayana:2,agni:3,veda:4,indriya:5,rudra:11,surya:12};
      const bd=s.btext.toLowerCase().split(/\s+/).filter(w=>w in BW).map(w=>BW[w]);
      const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ',sh=+s.shift;
      const outer=[...A].map((l,i)=>({l,t:`rotate(${i*360/26}deg) translateY(-104px)`}));
      const inner=[...A].map((l,i)=>({l:A[(i+sh)%26],t:`rotate(${i*360/26}deg) translateY(-72px)`}));
      const key=s.skey.toUpperCase().replace(/[^A-Z]/g,'');const ok=key.length===26&&new Set(key).size===26;
      const sout=!ok?'Key must use all 26 letters once.':s.smsg.toUpperCase().replace(/[A-Z]/g,c=>s.mode==='enc'?key[A.indexOf(c)]:A[key.indexOf(c)]);
      return {intro:s.intro,skip:()=>this.setState({intro:false}),stg,tl,px:s.px,py:s.py,
      mv:e=>{const w=window.innerWidth||1,h=window.innerHeight||1;this.setState({px:(e.clientX/w-.5)*-24,py:(e.clientY/h-.5)*-24});},
      btext:s.btext,setB:e=>this.setState({btext:e.target.value}),bdigits:bd.join(' ')||'-',bnum:bd.slice().reverse().join('')||'-',
      outer,inner,rot:-sh*360/26,lockY:s.mode==='enc'?0:-7,lockLabel:s.mode==='enc'?'Lock closed':'Lock open',
      skey:s.skey,smsg:s.smsg,sout,setSk:e=>this.setState({skey:e.target.value}),setSm:e=>this.setState({smsg:e.target.value})};
    }
  }

  const tplNodes=[...document.getElementById('tpl').content.childNodes];
  function val(p,ctx){p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],ctx)}
  const WH=/^\{\{\s*([^}]+?)\s*\}\}$/;
  function interp(v,ctx){return v.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(_,p)=>{const r=val(p,ctx);return r==null?'':r})}
  function build(n,ctx,out){
  if(n.nodeType===3){out.push(document.createTextNode(interp(n.data,ctx)));return}
  if(n.nodeType!==1)return;
  const t=n.localName;
  if(t==='sc-for'){const list=val(n.getAttribute('list').match(WH)[1],ctx)||[];const as=n.getAttribute('as');
    list.forEach((it,i)=>{const c=Object.create(ctx);c[as]=it;c.$index=i;n.childNodes.forEach(k=>build(k,c,out))});return}
  if(t==='sc-if'){if(val(n.getAttribute('value').match(WH)[1],ctx))n.childNodes.forEach(k=>build(k,ctx,out));return}
  const el=document.createElementNS(n.namespaceURI,t);
  for(const a of n.attributes){
    if(a.name.startsWith('hint-'))continue;
    const m=a.value.match(WH);
    if(a.name.startsWith('on')&&m){let ev=a.name.slice(2);if(ev==='change')ev='input';H.push(val(m[1],ctx));el.setAttribute('data-e-'+ev,H.length-1);continue}
    el.setAttribute(a.name,m?String(val(m[1],ctx)):interp(a.value,ctx));
  }
  n.childNodes.forEach(k=>build(k,ctx,{push:c=>el.appendChild(c)}));
  out.push(el)}
  function morph(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a.tagName==='INPUT'&&a!==document.activeElement)a.value=b.getAttribute('value')||'';
  morphKids(a,b)}
  function morphKids(a,b){const ak=[...a.childNodes],bk=[...b.childNodes];
  for(let i=0;i<bk.length;i++){const x=ak[i],y=bk[i];
    if(!x)a.appendChild(y);
    else if(x.nodeType===3&&y.nodeType===3){if(x.data!==y.data)x.data=y.data}
    else if(x.nodeType===1&&y.nodeType===1&&x.nodeName===y.nodeName)morph(x,y);
    else a.replaceChild(y,x)}
  for(let i=ak.length-1;i>=bk.length;i--)a.removeChild(ak[i])}
  function render(){H=[];const vals=comp.renderVals();const tmp=document.createElement('div');const out=[];
  tplNodes.forEach(n=>build(n,vals,{push:c=>tmp.appendChild(c)}));morphKids(root,tmp)}
  function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render()})}
  ['click','input','mousemove'].forEach(ev=>root.addEventListener(ev,e=>{const el=e.target.closest('[data-e-'+ev+']');if(el){const f=H[+el.getAttribute('data-e-'+ev)];if(typeof f==='function')f(e)}}));
  render();if(comp.componentDidMount)comp.componentDidMount();
  </script>
  </body>
  </html>
